<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>СПбПУ — 3D интерактивная карта кампуса</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#0a0f19;color:#eef3ff}
#app{width:100%;height:100%;position:relative}#scene{position:absolute;inset:0}
.panel{position:absolute;z-index:20;background:rgba(12,18,31,.88);border:1px solid rgba(255,255,255,.1);box-shadow:0 18px 60px #0007;backdrop-filter:blur(18px);border-radius:18px}
.left{left:18px;top:18px;width:300px;padding:18px}h1{font-size:17px;margin:0 0 4px}.sub{font-size:11px;color:#91a0bb;line-height:1.4}
.search{margin-top:15px;width:100%;padding:11px 12px;border-radius:11px;border:1px solid #ffffff12;background:#080e19;color:white;outline:0}
.tabs{display:flex;gap:5px;margin-top:11px}.tabs button,.actions button{border:0;background:#ffffff0b;color:#b8c4d9;border-radius:9px;padding:9px 10px;cursor:pointer;font-size:11px}
.tabs button.active,.actions button:hover{background:#7659ff;color:#fff}.list{margin-top:12px;max-height:48vh;overflow:auto;display:grid;gap:5px}
.item{padding:9px 10px;border-radius:10px;background:#ffffff07;border:1px solid transparent;cursor:pointer}.item:hover{background:#ffffff0d;border-color:#ffffff12}
.item b{display:block;font-size:11px}.item span{font-size:9px;color:#7f8da6}
.right{right:18px;top:18px;width:270px;padding:17px;display:none}.right.show{display:block}
.close{position:absolute;right:8px;top:5px;border:0;background:transparent;color:#94a2bb;font-size:22px;cursor:pointer}
.badge{display:inline-block;padding:4px 7px;background:#7659ff22;color:#bcaeff;border-radius:6px;font-size:9px;margin-bottom:8px}
#title{font-size:18px;font-weight:800;margin-bottom:7px}#desc{font-size:11px;line-height:1.55;color:#aab7cd}
.meta{margin-top:12px;padding-top:11px;border-top:1px solid #ffffff0e;font-size:10px;color:#8190aa;line-height:1.7}
.bottom{position:absolute;z-index:20;left:18px;bottom:18px;right:18px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.actions{display:flex;gap:5px;pointer-events:auto}.actions button{background:rgba(12,18,31,.88);border:1px solid #ffffff12;backdrop-filter:blur(14px)}
.hint{background:rgba(12,18,31,.78);border:1px solid #ffffff10;padding:8px 11px;border-radius:10px;font-size:9px;color:#91a0b7;pointer-events:auto}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:#0a0f19;z-index:50;font-size:12px;color:#9aa8c0}.loading.hide{display:none}
@media(max-width:760px){.left{width:calc(100% - 36px);max-height:48vh}.right{left:18px;right:18px;bottom:75px;top:auto;width:auto}.hint{display:none}}
</style>
</head>
<body>
<div id="app">
<div id="loading" class="loading">Загрузка 3D-модели кампуса…</div>
<div id="scene"></div>
<aside class="panel left">
<h1>СПбПУ · 3D Campus</h1>
<div class="sub">Интерактивная реконструкция по стенд-карте. Здания выполнены процедурными 3D-моделями.</div>
<input class="search" id="search" placeholder="Поиск корпуса…">
<div class="tabs"><button class="active" data-cat="all">Все</button><button data-cat="study">Учёба</button><button data-cat="sport">Спорт</button><button data-cat="service">Сервисы</button></div>
<div class="list" id="list"></div>
</aside>
<section class="panel right" id="info">
<button class="close" id="close">×</button><div class="badge" id="badge"></div><div id="title"></div><div id="desc"></div><div class="meta" id="meta"></div>
</section>
<div class="bottom">
<div class="hint">ЛКМ — выбрать · перетаскивание — вращение · колёсико — масштаб · ПКМ — панорамирование</div>
<div class="actions"><button id="top">Вид сверху</button><button id="iso">Изометрия</button><button id="reset">Сброс</button><button id="full">⛶</button></div>
</div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
import {OrbitControls} from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";

const buildings=[{"id": "B01", "name": "Главный корпус", "x": -27, "z": -9, "w": 12, "d": 7, "h": 8, "floors": 5, "type": "classic", "cat": "study"}, {"id": "B02", "name": "Учебный корпус", "x": -13, "z": -18, "w": 9, "d": 6, "h": 6, "floors": 4, "type": "modern", "cat": "study"}, {"id": "B03", "name": "Лабораторный корпус", "x": 1, "z": -17, "w": 8, "d": 6, "h": 7, "floors": 5, "type": "lab", "cat": "study"}, {"id": "B04", "name": "Административный корпус", "x": 15, "z": -13, "w": 8, "d": 6, "h": 7, "floors": 5, "type": "classic", "cat": "service"}, {"id": "B05", "name": "Научный корпус", "x": 25, "z": -1, "w": 10, "d": 7, "h": 9, "floors": 6, "type": "modern", "cat": "study"}, {"id": "B06", "name": "Спортивный комплекс", "x": 14, "z": 11, "w": 13, "d": 9, "h": 5, "floors": 3, "type": "sport", "cat": "sport"}, {"id": "B07", "name": "Стадион", "x": -1, "z": 12, "w": 17, "d": 12, "h": 1, "floors": 1, "type": "stadium", "cat": "sport"}, {"id": "B08", "name": "Учебно-лабораторный блок", "x": -17, "z": 10, "w": 10, "d": 7, "h": 7, "floors": 5, "type": "lab", "cat": "study"}, {"id": "B09", "name": "Общественный центр", "x": 28, "z": 14, "w": 9, "d": 7, "h": 5, "floors": 3, "type": "modern", "cat": "service"}, {"id": "B10", "name": "Сервисный корпус", "x": 39, "z": 4, "w": 7, "d": 6, "h": 5, "floors": 3, "type": "modern", "cat": "service"}, {"id": "B11", "name": "Инженерный корпус", "x": -35, "z": 5, "w": 8, "d": 6, "h": 6, "floors": 4, "type": "industrial", "cat": "study"}, {"id": "B12", "name": "Малый учебный корпус", "x": 38, "z": -13, "w": 7, "d": 5, "h": 4, "floors": 3, "type": "classic", "cat": "study"}];
const treeData=[[-42, -18], [-36, -15], [-30, -20], [-23, -25], [-8, -25], [8, -24], [22, -24], [34, -22], [44, -17], [-45, -5], [-39, -2], [-31, -4], [-22, -5], [-8, -5], [29, -6], [44, -3], [-42, 15], [-34, 20], [-25, 18], [-15, 21], [23, 21], [35, 20], [44, 17], [-35, 28], [-22, 28], [-9, 27], [6, 27], [20, 28], [35, 28]];
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xcfd6df);scene.fog=new THREE.Fog(0xcfd6df,100,210);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,500);camera.position.set(74,70,78);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById("scene").appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.07;controls.maxPolarAngle=Math.PI/2.03;controls.minDistance=28;controls.maxDistance=170;controls.target.set(0,0,0);controls.mouseButtons.LEFT=THREE.MOUSE.ROTATE;controls.mouseButtons.RIGHT=THREE.MOUSE.PAN;
scene.add(new THREE.HemisphereLight(0xffffff,0x718091,2.2));
const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(-45,90,35);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-90;sun.shadow.camera.right=90;sun.shadow.camera.top=90;sun.shadow.camera.bottom=-90;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(125,85),new THREE.MeshStandardMaterial({color:0x789a72,roughness:.95}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

function box(w,h,d,color,x,y,z,g){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.72}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;g.add(m);return m}
function road(x,z,w,d,r=0){const m=box(w,.08,d,0x78817e,x,.04,z,new THREE.Group());m.rotation.y=r;m.receiveShadow=true;scene.add(m)}
road(0,0,105,3);road(0,0,3,72);road(-28,-4,3,55);road(25,3,3,55);road(-2,-28,95,2);road(-2,29,95,2);
function plaza(x,z,w,d){const m=box(w,.12,d,0xb6b5ac,x,.08,z,new THREE.Group());scene.add(m)}
plaza(0,-1,18,15);plaza(29,8,12,11);

const palette={study:0xd8d4c9,service:0xc8c0b2,sport:0xc3c8cd};
const selectedMat=new THREE.MeshStandardMaterial({color:0x8d73ff,roughness:.62});
function windows(w,d,y,g){let n=Math.max(2,Math.floor(w/1.5));for(let i=0;i<n;i++){let x=-w/2+.7+i*(w-1.4)/(n-1);box(.5,.62,.035,0x425d70,x,y,d/2+.03,g);box(.5,.62,.035,0x425d70,x,y,-d/2-.03,g)}}
function classic(b,g){box(b.w,b.h,b.d,palette[b.cat],0,b.h/2,0,g);box(b.w+.2,.55,b.d+.4,0xe6dfcf,0,b.h+.28,0,g);box(b.w*.22,1.1,b.d*.55,0xd6cbbb,0,b.h+.8,0,g);const r=new THREE.Mesh(new THREE.ConeGeometry(b.w*.18,.8,4),new THREE.MeshStandardMaterial({color:0x77756f}));r.rotation.y=Math.PI/4;r.position.y=b.h+1.7;r.castShadow=true;g.add(r);windows(b.w,b.d,Math.min(2.1,b.h*.55),g)}
function modern(b,g){box(b.w,b.h,b.d,palette[b.cat],0,b.h/2,0,g);box(b.w+.18,.3,b.d+.18,0x4b5963,0,b.h+.16,0,g);for(let i=-2;i<=2;i++)box(.62,b.h*.72,.05,0x4f7990,i*(b.w/5),b.h*.55,b.d/2+.03,g)}
function lab(b,g){box(b.w,b.h,b.d,0xcfd1c8,0,b.h/2,0,g);for(let y=1;y<b.h-.3;y+=1.25)windows(b.w,b.d,y,g);box(b.w*.72,.5,b.d+.25,0x69757b,0,b.h+.25,0,g)}
function industrial(b,g){box(b.w,b.h,b.d,0xb9b4aa,0,b.h/2,0,g);box(b.w*.45,.8,.15,0x4e6269,0,b.h*.55,b.d/2+.08,g);box(b.w*.3,.35,b.d+.2,0x77756f,0,b.h+.18,0,g)}
function sport(b,g){box(b.w,b.h,b.d,0xc6ccd0,0,b.h/2,0,g);box(b.w+1,.45,b.d+1,0x596b79,0,b.h+.23,0,g);for(let x=-b.w*.35;x<=b.w*.35;x+=b.w*.18)box(.55,b.h*.72,.04,0x5b8194,x,b.h*.52,b.d/2+.03,g)}
function stadium(b,g){const o=new THREE.Mesh(new THREE.CylinderGeometry(b.w*.62,b.w*.62,.8,48),new THREE.MeshStandardMaterial({color:0x9b9d9b}));o.scale.z=.58;o.position.y=.4;o.castShadow=true;g.add(o);const f=box(b.w*.78,.14,b.d*.43,0x3f9c5b,0,.86,0,g);f.castShadow=true}
function makeBuilding(b){const g=new THREE.Group();g.position.set(b.x,0,b.z);g.userData=b;if(b.type==="classic")classic(b,g);else if(b.type==="modern")modern(b,g);else if(b.type==="lab")lab(b,g);else if(b.type==="industrial")industrial(b,g);else if(b.type==="sport")sport(b,g);else stadium(b,g);g.traverse(o=>{if(o.isMesh)o.userData.building=b});scene.add(g);return g}
const groups=buildings.map(makeBuilding);

function tree(x,z){const g=new THREE.Group();box(.32,1.6,.32,0x70533b,0,.8,0,g);const c=new THREE.Mesh(new THREE.SphereGeometry(1.45,12,9),new THREE.MeshStandardMaterial({color:0x3f8951,roughness:1}));c.position.y=2.25;c.scale.y=1.15;c.castShadow=true;g.add(c);g.position.set(x,0,z);scene.add(g)}
treeData.forEach(t=>tree(t[0],t[1]));

const selected=new THREE.MeshStandardMaterial({color:0x8d73ff,roughness:.62});
let active=null;
function select(g){if(active)active.traverse(o=>{if(o.isMesh&&o.userData.origMat){o.material=o.userData.origMat;delete o.userData.origMat}});active=g;g.traverse(o=>{if(o.isMesh){o.userData.origMat=o.material;o.material=selected}});const b=g.userData;document.getElementById("badge").textContent=(b.cat==="sport"?"СПОРТ":b.cat==="service"?"СЕРВИС":"УЧЁБА")+" · "+b.id;document.getElementById("title").textContent=b.name;document.getElementById("desc").textContent="Процедурная 3D-модель корпуса, собранная по композиции исходной стенд-карты.";document.getElementById("meta").innerHTML="Размер основания: "+b.w+" × "+b.d+" м (условно)<br>Высота модели: "+b.h+" м<br>Этажность: "+b.floors;document.getElementById("info").classList.add("show")}
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
renderer.domElement.addEventListener("pointerdown",e=>{pointer.x=e.clientX/innerWidth*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObjects(groups,true).find(h=>h.object.userData.building);if(hit){const id=hit.object.userData.building.id;select(groups.find(g=>g.userData.id===id))}});
document.getElementById("close").onclick=()=>document.getElementById("info").classList.remove("show");

function fillList(){const list=document.getElementById("list");list.innerHTML="";const q=document.getElementById("search").value.toLowerCase();const cat=document.querySelector(".tabs button.active").dataset.cat;buildings.filter(b=>(cat==="all"||b.cat===cat)&&(!q||b.name.toLowerCase().includes(q)||b.id.toLowerCase().includes(q))).forEach(b=>{const el=document.createElement("div");el.className="item";el.innerHTML="<b>"+b.id+" · "+b.name+"</b><span>"+b.floors+" этажей · "+b.w+"×"+b.d+" м</span>";el.onclick=()=>select(groups.find(g=>g.userData.id===b.id));list.appendChild(el)})}
document.getElementById("search").oninput=fillList;document.querySelectorAll(".tabs button").forEach(btn=>btn.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));btn.classList.add("active");fillList()});fillList();
document.getElementById("iso").onclick=()=>{camera.position.set(74,70,78);controls.target.set(0,0,0)};document.getElementById("top").onclick=()=>{camera.position.set(0,115,.01);controls.target.set(0,0,0)};document.getElementById("reset").onclick=()=>{camera.position.set(74,70,78);controls.target.set(0,0,0);controls.reset()};document.getElementById("full").onclick=()=>document.documentElement.requestFullscreen?.();
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.getElementById("loading").classList.add("hide");
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script>
</body></html>
